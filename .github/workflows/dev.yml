name: Dev Rolling Build

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dev-release:
    runs-on: ubuntu-latest
    outputs:
      dev_version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check for Changes and Generate Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            COMMITS=$(git log --since="24 hours ago" --oneline)
            if [ -z "$COMMITS" ]; then
              echo "No changes in the last 24 hours. Skipping dev build."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          # Get the current base version from package.json
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version.split('-')[0])")
          DATE=$(date +'%Y%m%d')
          DEV_VERSION="${CURRENT_VERSION}-dev.${DATE}"
          
          echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
          echo "Created version $DEV_VERSION"

      - name: Recreate Rolling Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Delete existing dev release and tag via GitHub API
          gh release delete dev --cleanup-tag -y || true
          
          # 2. Create fresh release and atomically anchor 'dev' tag to current commit via API
          gh release create dev \
            --title "Dev Rolling Build v${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --notes "Rolling dev build containing the latest changes."

  build-and-upload:
    needs: dev-release
    if: needs.dev-release.outputs.skip != 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: dev
      override_version: ${{ needs.dev-release.outputs.dev_version }}
